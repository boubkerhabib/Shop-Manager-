
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-blue-50 text-gray-800">

    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="logoPart flex items-center gap-3">
                <img src="assets/Logo/logo.png" alt="logo" class="w-15 h-15 object-contain">
                <span id="textLogo" class="text-2xl font-bold text-blue-700">
                    Shop Manager
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <section id="titleMain"
            class="flex flex-col-reverse md:flex-row items-center justify-between gap-10 bg-white rounded-2xl p-8 md:p-12 shadow-sm">

            <div id="textHero" class="flex-1 text-center md:text-left">
                <span class="text-blue-600 font-semibold text-sm uppercase tracking-wider">
                    Bienvenue chez Shop Manager
                </span>

                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mt-4">
                    Shop Manager
                </h1>

                <p class="text-gray-500 text-lg mt-5 leading-relaxed">
                    Découvrez notre catalogue de produits et trouvez
                    ce dont vous avez besoin !
                </p>

                <a href="#listProductsByFilter"
                    class="inline-block mt-7 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-7 py-3 rounded-lg transition duration-300">
                    Découvrir les produits
                </a>
            </div>

            <div id="imgHero" class="flex-1 flex justify-center">
                <img src="assets/Image/hero.png"
                    width="400"
                    alt="Image de présentation"
                    class="w-full max-w-md object-contain">
            </div>

        </section>

        <section id="inputSearch" class="mt-12">
            <div id="searchInput" class="max-w-2xl mx-auto">
                <div class="relative">

                    <img
                        src="assets/Icon/search.png"
                        alt="search"
                        class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5"
                    >

                    <input
                        id="input"
                        type="text"
                        placeholder="Rechercher un produit..."
                        class="w-full bg-white border border-gray-200 rounded-xl px-5 py-4 pl-12 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm"
                    >

                </div>
            </div>
        </section>
        </section>

        <!-- filter buttin -->
        <section class="mt-8">
            <div id="filterButtons" class="flex flex-wrap justify-center gap-3">

                <button id="Tous" class="hover:bg-blue-600 hover:text-white">Tous</button>
                <button id="Books" class="hover:bg-blue-600 hover:text-white">Books</button>
                <button id="Electronics" class="hover:bg-blue-600 hover:text-white">Electronics</button>
                <button id="Kitchen" class="hover:bg-blue-600 hover:text-white">Kitchen</button>
                <button id="Outdoor" class="hover:bg-blue-600 hover:text-white">Outdoor</button>

            </div>
        </section>


        <section id="listProductsByFilter" class="mt-14">

            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-7">

            </div>

            <div id="listProducts"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

            

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-white mt-20">
        <div class="max-w-7xl mx-auto px-6 py-10 text-center">

            <p class="text-gray-300">
                Gerez vos produits et decouvrez notre catalogue en toute simplicite.
            </p>

            <div class="border-t border-gray-700 mt-7 pt-6">
                <p id="droitFooter" class="text-gray-400 text-sm">
                    © 2026 Shop Manager. Tous droits reserves.
                </p>
            </div>

        </div>
    </footer>

    <script src="JS/script.js"></script>

</body>
</html>
